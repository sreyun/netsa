# 演示配置：配合 `netsa simulate -o demo-logs` 生成的模拟日志使用
server:
  listen: ":8080"
  # 演示环境的登录账号（生产环境请勿使用弱口令；不配置时首次启动自动生成 admin 初始密码并输出到日志）
  username: admin
  password: "Netsa@demo2026"
  pprof: true            # 演示环境开启性能剖析，便于验证 /debug/pprof/（仅管理员）

home:
  name: "上海数据中心"
  lat: 31.23
  lon: 121.47

sources:
  - name: nginx
    type: auto
    paths: ["demo-logs/access.log"]
    from_beginning: true
    host: www.example.com
  - name: ufw
    type: auto
    paths: ["demo-logs/ufw.log"]
    from_beginning: true
  - name: fortigate
    type: auto
    paths: ["demo-logs/fortigate.log"]
    from_beginning: true
  - name: ssh
    type: auth
    paths: ["demo-logs/auth.log"]
    from_beginning: true
  - name: dns
    type: dns
    paths: ["demo-logs/dns.log"]
    from_beginning: true
  - name: edr
    type: edr            # 服务器的进程日志（Elastic Agent / ECS 格式）
    paths: ["demo-logs/process.log"]
    from_beginning: true

syslog:
  enabled: true
  udp: ":5514"
  tcp: ":5514"

geo:
  reverse_dns: false   # 演示数据为随机 IP，反向解析意义不大
  enrich_level: low
  online:
    enabled: true      # 演示 IP 为随机生成，开启在线溯源以便在地图上显示坐标
    rdap: true
  # 演示情报中的外连目标是 RFC 5737 文档地址，定位库里没有记录：给出示意位置，地图上能看到“内部对外”的飞线
  custom:
    - { cidr: 203.0.113.66/32, name: "演示 C2 服务器（阿姆斯特丹）", country: "荷兰", country_code: NL, city: "阿姆斯特丹", lat: 52.37, lon: 4.90 }
    - { cidr: 203.0.113.77/32, name: "演示载荷服务器（法兰克福）", country: "德国", country_code: DE, city: "法兰克福", lat: 50.11, lon: 8.68 }
    - { cidr: 203.0.113.99/32, name: "演示矿池（新加坡）", country: "新加坡", country_code: SG, city: "新加坡", lat: 1.35, lon: 103.82 }

detect:
  rules_file: configs/rules.example.yaml

# 演示用威胁情报：模拟日志中内网主机 10.0.0.31 / 10.0.0.32 会周期性外连其中的地址，用于演示失陷主机检测
intel:
  blocklists:
    - name: 演示威胁情报
      path: configs/demo-intel.txt

storage:
  snapshot: ""         # 演示环境不保存快照

# 原始日志留存（日志检索 / 告警前后的原始日志 / 取证导出）与防篡改审计链
rawlog:
  enabled: true
  dir: state/demo-rawlog   # 容器演示中 demo-logs 为只读挂载，留存目录放在可写的 state 下
  retention_days: 180
audit:
  dir: state/demo-audit

# 演示用诱饵：/backup.zip、/old/ 是扫描器常探测的路径，模拟日志中的扫描会命中；页面中可继续登记
deception:
  paths: ["/backup.zip", "/old/*"]
