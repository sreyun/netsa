# 自定义检测规则示例
# pattern 为 Go 正则（RE2 语法，自动忽略大小写），匹配的是“多轮 URL 解码 + 小写化”之后的文本
# target: uri（路径+参数） | path（仅路径） | ua | referer | any（三者合并）
#
# severity 只是「建议值」，最终等级由分类底线 + 响应结果统一裁决（见 README「威胁等级判定」）：
#   - 拼写错误（如 hgih）会导致启动失败，不再静默降级为 info；
#   - 低于分类底线的声明会被自动提升并在启动日志中提示；
#   - 已拦截 / 请求失败的利用最高为高危，成功利用与失陷迹象才会达到严重。
# category 建议使用内置分类名（`netsa rules` 可查看）；自定义分类没有等级底线，
# 完全按 severity 声明执行，启动日志会列出这些分类以便核对拼写。

# 禁用不需要的内置规则（规则 ID 可通过 `netsa rules` 查看）
disable: []
#  - ua-automation

rules:
  - id: custom-internal-api
    name: 访问内部管理接口
    category: 越权访问
    severity: high
    phase: exploit
    target: path
    pattern: '^/(internal|inner)/api/'

  - id: custom-sensitive-export
    name: 批量导出用户数据
    category: 数据窃取
    severity: medium
    phase: exploit
    target: uri
    pattern: '/api/v\d+/users/export\?.*(limit|size)=\d{4,}'
