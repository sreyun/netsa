# 生产部署（直接使用华为云 SWR 上发布的镜像，无需在服务器上编译），依次执行（Windows PowerShell 5.1 不支持 &&，请逐行执行）：
#   docker compose pull
#   docker compose up -d
# 浏览器访问 http://<服务器IP>:8080 ，防火墙/网络设备 syslog 发送到 <服务器IP>:5514
# 镜像地址、版本、对外端口、管理员初始密码、告警归档等均可在同目录的 .env 中设置，模板见 .env.example
name: netsa

services:
  netsa:
    # 默认跟随最新发布版本；生产环境建议在 .env 中固定版本，例如
    #   NETSA_IMAGE=swr.cn-east-3.myhuaweicloud.com/sreyun/netsa:1.7.2
    # 内网环境可改为私有仓库地址；从源码构建的镜像同样通过该变量指定（见 docs/deployment.md「从源码构建镜像」）
    image: ${NETSA_IMAGE:-swr.cn-east-3.myhuaweicloud.com/sreyun/netsa:latest}
    container_name: netsa
    restart: unless-stopped
    command: ["serve", "-c", "/app/configs/docker.yaml"]
    # 容器加固：去掉全部 Linux 能力、禁止提权、根文件系统只读，只有状态卷和 /tmp 可写。
    # 程序监听的端口都高于 1024，不需要任何能力。需要写其他目录时请挂载卷，不要去掉 read_only。
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    # 内存占用随 storage.max_ips / max_alerts 增长。容器上限可在 .env 中调整；GOMEMLIMIT 让垃圾回收在
    # 接近上限时更积极，否则堆内存可以涨到存活数据的两倍，容器会被 OOM 杀掉。请设为容器上限的 85% 左右
    mem_limit: ${NETSA_MEM_LIMIT:-4g}
    pids_limit: 512
    environment:
      TZ: Asia/Shanghai
      GOMEMLIMIT: ${NETSA_GOMEMLIMIT:-3400MiB}
      # 可选：首次启动时管理员 admin 的初始密码；不设置则随机生成并输出在日志中（docker compose logs netsa | grep 初始密码）
      NETSA_ADMIN_PASSWORD: ${NETSA_ADMIN_PASSWORD:-}
      # 可选：告警归档连接串，在 .env 中设置后生效（未设置时不启用归档，无需数据库），见下方 postgres 服务说明
      NETSA_ARCHIVE_DSN: ${NETSA_ARCHIVE_DSN:-}
      # 周报月报发信口令；NETSA_AI_API_KEY 仅兼容旧部署，模型密钥请在页面「自学习 → 外部模型」中配置
      NETSA_AI_API_KEY: ${NETSA_AI_API_KEY:-}
      NETSA_SMTP_PASSWORD: ${NETSA_SMTP_PASSWORD:-}
    # 宿主机端口可在 .env 中修改（NETSA_HTTP_PORT / NETSA_SYSLOG_PORT），用于避开已占用的端口；
    # 容器内端口固定为 8080 / 5514，与 configs/docker.yaml 一致，不要改冒号右侧
    ports:
      - "${NETSA_HTTP_PORT:-8080}:8080"
      - "${NETSA_SYSLOG_PORT:-5514}:5514/udp"
      - "${NETSA_SYSLOG_PORT:-5514}:5514/tcp"
    # 读取 /var/log/nginx 通常需要 adm 组（Debian/Ubuntu 上 gid=4）
    group_add:
      - "4"
    volumes:
      # 配置文件挂载为只读，修改后 docker compose restart netsa 生效。
      # 必须与本文件放在一起：缺少该文件时 Docker 会创建同名空目录，容器无法启动
      - ./configs/docker.yaml:/app/configs/docker.yaml:ro
      # 必须挂载目录而不是单个文件：logrotate 轮转会创建新文件，单文件挂载会一直指向旧文件
      - /var/log/nginx:/logs/nginx:ro
      - /var/log:/logs/host:ro
      # 可选：MaxMind GeoLite2 数据库（获得精确经纬度与 ASN）
      # - ./data/GeoLite2-City.mmdb:/app/data/GeoLite2-City.mmdb:ro
      # - ./data/GeoLite2-ASN.mmdb:/app/data/GeoLite2-ASN.mmdb:ro
      - netsa-state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # 可选：告警归档数据库（PostgreSQL 18，pgvector 镜像）。默认不启动；启用方法：
  #   1. 在本目录的 .env 文件中写入（两处密码相同，使用强密码）：
  #        POSTGRES_PASSWORD=强密码
  #        NETSA_ARCHIVE_DSN=postgres://netsa:强密码@postgres:5432/netsa?sslmode=disable
  #   2. docker compose --profile archive up -d
  # 已有 PostgreSQL 时无需启动此服务，把 NETSA_ARCHIVE_DSN 指向现有数据库即可。
  postgres:
    image: ${PG_IMAGE:-swr.cn-east-3.myhuaweicloud.com/sreyun/pgvector:pg18}
    container_name: netsa-postgres
    profiles: ["archive"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: netsa
      POSTGRES_DB: netsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      TZ: Asia/Shanghai
    # 不映射端口，只允许同一 compose 网络中的 netsa 访问；需用外部工具连接时可加 "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 镜像的数据目录为 /var/lib/postgresql/18/docker，数据卷须挂载到 /var/lib/postgresql
      - netsa-pg18:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsa -d netsa"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  netsa-state:
  netsa-pg18:
